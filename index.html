<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidGrab</title>
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#10201c;--mute:#5d716b;--line:#d9e3df;--acc:#0b8a73;--acc-ink:#fff;--err:#c8362b}
:root[data-theme=dark]{--bg:#0d1513;--card:#15201d;--ink:#e8f2ef;--mute:#8aa39b;--line:#25352f;--acc:#3ddbb8;--acc-ink:#06201a;--err:#ff7a6e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:22px;margin:0;letter-spacing:-.02em}
.tools button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;margin-left:6px;cursor:pointer}
textarea{width:100%;min-height:120px;resize:vertical;padding:16px;font:inherit;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
textarea:focus{outline:none;border-color:var(--acc)}
.row{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5}
.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px;display:grid;grid-template-columns:120px 1fr;gap:12px}
.card img{width:120px;height:90px;object-fit:cover;border-radius:8px;background:var(--line)}
.title{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--mute);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.chip:disabled{opacity:.35;cursor:default}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.err{color:var(--err);font-size:14px}
.full{grid-column:1/-1}
h2{font-size:16px;margin:32px 0 0;color:var(--mute);font-weight:600}
.hist{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:8px}
@media(max-width:420px){.card{grid-template-columns:96px 1fr}.card img{width:96px;height:72px}}
</style>
</head>
<body>
<main>
<header>
  <h1>VidGrab</h1>
  <div class="tools"><button id="lang"></button><button id="theme"></button></div>
</header>

<textarea id="urls" data-i18n-ph="ph" autofocus></textarea>
<div class="row">
  <button class="btn" id="go" data-i18n="find"></button>
  <button class="btn ghost" id="paste" data-i18n="paste"></button>
</div>
<div id="list"></div>
<h2 data-i18n="history"></h2>
<div id="hist"></div>
</main>

<script>
// ---------- i18n ----------
const T={
ru:{ph:"Вставьте ссылки на YouTube или TikTok — по одной на строку",find:"Найти",paste:"Вставить",history:"История",
 dl:"Скачать",queued:"В очереди",processing:"Обработка…",done:"Готово",audio:"MP3 (аудио)",video:"MP4 (видео)",
 notif:"Загрузка завершена",empty:"Пока пусто",
 e:{unsupported:"Ссылка не поддерживается",private:"Видео приватное",login_required:"Нужен вход в аккаунт",
 age_restricted:"Видео с возрастным ограничением",geo_blocked:"Недоступно в вашем регионе",unavailable:"Видео удалено или недоступно",unknown:"Не удалось получить видео. Попробуйте позже"}},
en:{ph:"Paste YouTube or TikTok links, one per line",find:"Find",paste:"Paste",history:"History",
 dl:"Download",queued:"Queued",processing:"Processing…",done:"Done",audio:"MP3 (audio)",video:"MP4 (video)",
 notif:"Download complete",empty:"Nothing yet",
 e:{unsupported:"Link not supported",private:"This video is private",login_required:"Sign-in required",
 age_restricted:"Age-restricted video",geo_blocked:"Not available in your region",unavailable:"Video removed or unavailable",unknown:"Could not fetch the video. Try again later"}}};
let lang=localStorage.lang||(navigator.language.startsWith("ru")?"ru":"en");
const $=s=>document.querySelector(s), t=k=>T[lang][k];
function applyLang(){
  document.documentElement.lang=lang; $("#lang").textContent=lang.toUpperCase();
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  renderHist();
}
$("#lang").onclick=()=>{lang=lang==="ru"?"en":"ru";localStorage.lang=lang;applyLang()};

// ---------- theme ----------
let theme=localStorage.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
function applyTheme(){document.documentElement.dataset.theme=theme;$("#theme").textContent=theme==="dark"?"☀":"☾"}
$("#theme").onclick=()=>{theme=theme==="dark"?"light":"dark";localStorage.theme=theme;applyTheme()};

// ---------- history ----------
const getH=()=>JSON.parse(localStorage.hist||"[]");
function addH(e){localStorage.hist=JSON.stringify([e,...getH()].slice(0,50));renderHist()}
function renderHist(){
  const h=getH();
  $("#hist").innerHTML=h.length?h.map(x=>`<div class="hist"><span>${esc(x.title)}</span><span class="meta">${x.q} · ${new Date(x.at).toLocaleDateString(lang)}</span></div>`).join(""):`<p class="meta">${t("empty")}</p>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDur=s=>s?`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`:"";

// ---------- queue ----------
const QUALS=[360,720,1080,1440,2160];
async function addUrl(url){
  const el=document.createElement("div");el.className="card";el.innerHTML=`<div class="meta full">${esc(url)}…</div>`;
  $("#list").prepend(el);
  try{
    const r=await fetch("/api/info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
    if(!r.ok)throw new Error((await r.json()).detail);
    mountCard(el,url,await r.json());
  }catch(e){el.innerHTML=`<div class="err full">${esc(T[lang].e[e.message]||T[lang].e.unknown)}<br><span class="meta">${esc(url)}</span></div>`}
}
function mountCard(el,url,d){
  const maxH=Math.max(0,...d.heights);
  let q=[...QUALS].reverse().find(x=>x<=maxH)||1080, fmt="mp4";
  el.innerHTML=`<img src="${esc(d.thumbnail||"")}" alt="">
  <div><div class="title">${esc(d.title)}</div><div class="meta">${esc(d.author||"")} · ${fmtDur(d.duration)} · ${d.platform}</div></div>
  <div class="full"><div class="chips" data-q></div><div class="chips" data-f></div>
  <button class="btn" data-go></button><div class="bar" hidden><i></i></div><div class="meta" data-st></div></div>`;
  const qb=el.querySelector("[data-q]"),fb=el.querySelector("[data-f]"),go=el.querySelector("[data-go]");
  go.textContent=t("dl");
  const draw=()=>{
    qb.hidden=fmt==="mp3";
    qb.innerHTML=QUALS.map(x=>`<button class="chip ${x===q?"on":""}" data-v="${x}" ${x>maxH&&maxH?"disabled":""}>${x===2160?"4K":x+"p"}</button>`).join("");
    fb.innerHTML=["mp4","mp3"].map(f=>`<button class="chip ${f===fmt?"on":""}" data-f="${f}">${t(f==="mp4"?"video":"audio")}</button>`).join("");
    qb.querySelectorAll(".chip:not(:disabled)").forEach(b=>b.onclick=()=>{q=+b.dataset.v;draw()});
    fb.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{fmt=b.dataset.f;draw()});
  };draw();
  go.onclick=()=>start(el,url,d,q,fmt,go);
}
async function start(el,url,d,quality,format,btn){
  btn.disabled=true;
  const bar=el.querySelector(".bar"),fill=bar.firstElementChild,st=el.querySelector("[data-st]");
  bar.hidden=false;st.textContent=t("queued");
  const r=await fetch("/api/jobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url,quality,format})});
  const {id}=await r.json();
  const es=new EventSource(`/api/jobs/${id}/events`);
  es.onmessage=m=>{
    const j=JSON.parse(m.data);fill.style.width=j.percent+"%";
    if(j.status==="downloading")st.textContent=`${j.percent}%${j.speed?" · "+(j.speed/1048576).toFixed(1)+" MB/s":""}${j.eta?" · "+j.eta+"s":""}`;
    if(j.status==="processing")st.textContent=t("processing");
    if(j.status==="done"){
      es.close();st.textContent=t("done");btn.disabled=false;
      const a=document.createElement("a");a.href=`/api/jobs/${id}/file`;a.click();
      addH({title:d.title,q:format==="mp3"?"MP3":quality+"p",at:Date.now()});
      if(Notification.permission==="granted")new Notification("VidGrab",{body:`${t("notif")}: ${d.title}`});
    }
    if(j.status==="error"){es.close();bar.hidden=true;btn.disabled=false;st.innerHTML=`<span class="err">${esc(T[lang].e[j.error]||T[lang].e.unknown)}</span>`}
  };
}
$("#go").onclick=()=>{
  if("Notification"in window&&Notification.permission==="default")Notification.requestPermission();
  const urls=[...new Set($("#urls").value.split(/\s+/).filter(Boolean))];
  urls.forEach(addUrl);$("#urls").value="";
};
$("#paste").onclick=async()=>{try{$("#urls").value+=(await navigator.clipboard.readText())+"\n"}catch{}};
applyTheme();applyLang();
</script>
</body>
</html>
